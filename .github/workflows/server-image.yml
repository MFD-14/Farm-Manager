# Builds the server (API + web app) as a ready-to-run image for both Intel/AMD
# machines (Google Cloud e2-micro) and ARM machines (Oracle Ampere), so a small
# free server only has to download it:
#   ghcr.io/mfd-14/farm-manager:latest
name: Server image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION_NAME=1.2.${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Woodlands Farm Manager
            org.opencontainers.image.vendor=Musara Holdings LLC
          tags: |
            ghcr.io/mfd-14/farm-manager:latest
            ghcr.io/mfd-14/farm-manager:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
