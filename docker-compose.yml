# One-command deployment: `docker compose up -d`, then open http://<host>:4000
# With HTTPS for phones (Caddy fetches the certificate for DOMAIN in .env):
#   docker compose --profile https up -d
# scripts/install-server.sh does all of this on a fresh cloud server.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wfm
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: wfm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wfm"]
      interval: 5s
      retries: 10

  app:
    # Prebuilt by .github/workflows/server-image.yml; `docker compose build`
    # builds it from this checkout instead.
    image: ${APP_IMAGE:-ghcr.io/mfd-14/farm-manager:latest}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wfm:${DB_PASSWORD:-change-me}@db:5432/wfm
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?set OWNER_PASSWORD in .env}
      CARETAKER_PASSWORD: ${CARETAKER_PASSWORD:?set CARETAKER_PASSWORD in .env}
      FARM_TZ: Africa/Harare
      TANK_USABLE: ${TANK_USABLE:-80000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VIM_MODE: ${VIM_MODE:-heuristic}
      WA_TOKEN: ${WA_TOKEN:-}
      WA_PHONE_ID: ${WA_PHONE_ID:-}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-change-me-verify}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
      VIM_MODEL: ${VIM_MODEL:-claude-opus-5-5}
      VIM_MONTHLY_CAP_USD: ${VIM_MONTHLY_CAP_USD:-20}
    ports:
      - "4000:4000"
    volumes:
      - media:/data

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
